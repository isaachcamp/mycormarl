[project]
name = "mycormarl"
version = "0.1.0"
description = "Mycorrhizal networks with MARL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.9.0",
    "jax-dataclasses>=1.6.3",
    "jaxmarl>=0.0.2",
    "chex>=0.1.90",
    "flax>=0.12.0",
    "optax>=0.2.6",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pytest>=9.0.2",
]

[tool.setuptools]
package-dir = {"" = "mycormarl"}

[tool.setuptools.packages.find]
where = ["mycormarl"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
